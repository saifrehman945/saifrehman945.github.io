      - layout: top-middle
        title: Adjoint-Based Shape Optimization Framework
        quote: >
          Technologies: C++, Python, Adjoint Solvers, Vertex Morphing, CFD/FEA Coupling
        description: |
          <div style="display:flex; gap:24px; align-items:flex-start; flex-wrap:wrap;">

            <!-- LEFT: TEXT -->
            <div style="flex:3; min-width:260px;">
              <p>
              Contributed to a <strong>large-scale adjoint-driven shape optimization framework</strong> spanning fluid, structural, and multi-physics applications. 
              The system combines <strong>C++ optimization kernels</strong> for compute-intensive tasks (mapping, search, linear algebra) with a 
              <strong>Python orchestration layer</strong> for workflow management, solver coupling, and rapid prototyping.
              </p>

              <p><strong>Core optimization problem:</strong></p>

              <div style="text-align:center; margin: 10px 0;">
              \[
              \min_{\mathbf{s}} \; J\big(\mathbf{X}_{\Gamma}(\mathbf{s}), \mathbf{Q}(\mathbf{X}_{\Gamma})\big)
              \]
              \[
              \text{subject to: } \mathbf{r}\big(\mathbf{X}_{\Gamma}(\mathbf{s}), \mathbf{Q}(\mathbf{X}_{\Gamma})\big) = 0
              \]
              </div>

              <p>
              where \( \mathbf{s} \) represents design variables, \( \mathbf{X}_{\Gamma} \) the surface geometry, and \( \mathbf{Q} \) the state variables governed by physics solvers.
              </p>

              <ul>
                <li><strong>Vertex morphing</strong> ensures smooth, mesh-consistent updates</li>
                <li><strong>Adjoint gradients</strong> enable scalable high-dimensional optimization</li>
                <li><strong>Hybrid C++ + Python</strong> architecture for performance + flexibility</li>
                <li>Integrated with Abaqus, OptiStruct, KratosMultiphysics, Star-CCM+</li>
              </ul>
            </div>

            <!-- RIGHT: IMAGE -->
            <div style="flex:2; min-width:220px; text-align:center;">
              <img src="/images/projects/adjoint_architechure.png"
                  alt="Adjoint-Based Optimization Architecture"
                  style="width:100%; border-radius:10px; box-shadow:0 4px 20px rgba(0,0,0,0.6);" />
            </div>

          </div>


