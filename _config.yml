    content:

      - layout: top-middle
        title: Drag Reduction via Ventilated Supercavitation with KAN Surrogate
        link: https://github.com/saifrehman945/VentilatedSupercavitation
        link_text: saifrehman945/VentilatedSupercavitation
        additional_links:
          - title: GitHub
            icon: fab fa-github
            url: https://github.com/saifrehman945/VentilatedSupercavitation
        quote: >
          Technologies: ANSYS Fluent, KAN, ANN, SVM, Python, RANS-VOF Multiphase
        description: |
          <div style="display:flex; gap:24px; align-items:flex-start; flex-wrap:wrap; margin-top:8px;">
            <div style="flex:3; min-width:260px;">
              <p>Engineered and validated a <strong>multiphase RANS–VOF CFD model</strong> to investigate ventilated supercavitation for drag reduction in underwater projectiles. Applied <strong>Kolmogorov-Arnold Network (KAN)</strong> surrogate modeling on CFD time-series data for real-time drag prediction — a direct application of the AI-CFD paradigm.</p>
              <ul>
                <li>CFD model rigorously validated against experimental and numerical benchmarks — captures intricate unsteady features of highly turbulent cavitating flows</li>
                <li><strong>27% drag reduction</strong> achieved; 10% decrease in cavitation number leads to significant additional reduction</li>
                <li>Parametric study: ventilation coefficient (Cq = 0.60, 0.25, 0.15), disk vs cone cavitators, unsteady cavity shedding dynamics</li>
                <li><strong>KAN outperforms ANN and SVM</strong> for time-dependent Cd prediction — superior accuracy, stability, and error minimization</li>
              </ul>
            </div>
            <div style="flex:2; min-width:200px; display:flex; flex-direction:column; gap:10px; text-align:center;">
              <video autoplay loop muted playsinline controls style="width:100%; border-radius:8px; box-shadow:0 3px 16px rgba(0,0,0,0.6);">
                <source src="https://github.com/user-attachments/assets/f51adce3-11e9-426d-900f-5546f757a74e" type="video/mp4">
              </video>
              <img src="/images/projects/cavitation_comparison.png" alt="Volume Fraction: With vs Without Ventilation" style="width:100%; border-radius:8px; box-shadow:0 3px 16px rgba(0,0,0,0.6);" />
