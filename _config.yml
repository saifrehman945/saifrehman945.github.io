    content:
      - layout: top-middle
        title: "KAN-Enhanced CFD Modeling of Drag Reduction in Ventilated Super-Cavities Around Underwater Projectiles"
        additional_links:
          - title: Abstract — Applied Energy
            icon: fas fa-external-link-alt
            url: https://drive.google.com/file/d/1kZEkLTSeFsc2uFp_tjWxbnCTLbBgscmk/view?usp=drive_link
          - title: GitHub Repo
            icon: fab fa-github
            url: https://github.com/saifrehman945/VentilatedSupercavitation
        quote: >
          Under Review — Engineering Applications of Artificial Intelligence (2025) | 2nd Author
        description: |
          <div style="display:flex; gap:22px; align-items:center; flex-wrap:wrap;">
            <div style="flex:3; min-width:260px;">
              <p>Couples <strong>unsteady RANS–VOF</strong> multiphase CFD with a <strong>Kolmogorov-Arnold Network (KAN)</strong> surrogate to model and predict unsteady drag in ventilated super-cavities around underwater projectiles — directly bridging high-fidelity simulation with AI-driven design acceleration.</p>
              <ul>
                <li><strong>27% drag reduction</strong> achieved through optimized ventilation, translating to 27% lower propulsion power demand</li>
                <li>KAN model trained on CFD time-series data <strong>outperforms ANN and SVM</strong> in accuracy and error minimization across all ventilation conditions (Cq = 0.60, 0.25, 0.15)</li>
                <li>Ventilation coefficient strongly governs cavity dynamics and energy-saving potential</li>
                <li>CFD model rigorously validated against experimental and numerical benchmarks</li>
              </ul>
            </div>
            <div style="flex:2; min-width:180px; text-align:center;">
              <img src="/images/projects/cavitation_comparison.png" alt="CFD: Ventilated vs Non-Ventilated Projectile — 65% drag difference" style="width:100%; border-radius:8px; box-shadow:0 3px 14px rgba(0,0,0,0.6);" />
              <p style="font-size:11px; color:#888; margin-top:6px;">Volume fraction: ventilated vs non-ventilated (65% drag difference)</p>
            </div>
          </div>

      - layout: top-middle
        title: "Synergistic Effects of Al₂O₃–Ethylene Glycol/Water Nanofluids and Artificial Roughness on Solar Heater Thermal Performance"
        additional_links:
          - title: Springer
            icon: fas fa-external-link-alt
            url: https://doi.org/10.1007/s10973-025-14571-4
          - title: Scholar
            icon: fas fa-book
            url: https://scholar.google.com/citations?view_op=view_citation&hl=en&user=--WM-zoAAAAJ&citation_for_view=--WM-zoAAAAJ:0EnyYjriUFMC
        quote: >
          Published — Journal of Thermal Analysis and Calorimetry, Springer (2025) | 2nd Author
        description: |
          <div style="display:flex; gap:22px; align-items:center; flex-wrap:wrap;">
            <div style="flex:3; min-width:260px;">
              <p>CFD parametric study of <strong>Al₂O₃ nanofluid</strong> (EG/Water) combined with artificial rib roughness to maximize solar heater thermal performance — validated against Dittus-Boelter correlation and experimental data using steady-state <strong>RANS with RNG k–ε</strong>.</p>
              <ul>
                <li>Optimal: <strong>inverted triangular ribs</strong> + 40%EG/60%Water nanofluid → <strong>71.6% heat transfer enhancement</strong> at Re = 18,000</li>
                <li>Peak <strong>Performance Evaluation Criterion (PEC = 1.5)</strong> — thermal gain exceeds pumping penalty</li>
                <li>TKE analysis reveals micro-vortex formation at rib–fluid interfaces driving boundary layer disruption</li>
              </ul>
            </div>
            <div style="flex:2; min-width:180px; text-align:center;">
              <img src="/images/projects/tke_triangular.png" alt="TKE Contour — Triangular Rib Configuration" style="width:100%; border-radius:8px; box-shadow:0 3px 12px rgba(0,0,0,0.5);" />
              <p style="font-size:11px; color:#888; margin-top:6px;">TKE contour — triangular rib solar duct</p>
            </div>
          </div>

  - title: Projects
