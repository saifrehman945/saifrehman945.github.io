about_content: |
  I am a **CFD Researcher and Engineer** working at the intersection of **physics-based simulation** and
  **data-driven AI**, with hands-on experience in multiphase flow modeling, adjoint-based shape optimization,
  and neural network surrogate integration. My work bridges validated **RANS–VOF cavitation solvers** with
  **Kolmogorov-Arnold Network (KAN)** surrogate models for real-time drag prediction, and extends to
  **adjoint-driven shape optimization** with vertex morphing for industrial-scale design problems.

  <div style="margin-top:20px;">
    <div style="font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:#888; margin-bottom:10px;">Research Interests</div>
    <span style="display:inline-block; border:1px solid #4fc3f7; color:#4fc3f7; background:rgba(79,195,247,0.12); padding:4px 12px; border-radius:16px; font-size:12px; margin:3px 2px;">Computational Fluid Dynamics</span>
    <span style="display:inline-block; border:1px solid #4fc3f7; color:#4fc3f7; background:rgba(79,195,247,0.12); padding:4px 12px; border-radius:16px; font-size:12px; margin:3px 2px;">Adjoint-Based Optimization</span>
    <span style="display:inline-block; border:1px solid #81c784; color:#81c784; background:rgba(129,199,132,0.12); padding:4px 12px; border-radius:16px; font-size:12px; margin:3px 2px;">AI / Surrogate Modeling</span>
    <span style="display:inline-block; border:1px solid #81c784; color:#81c784; background:rgba(129,199,132,0.12); padding:4px 12px; border-radius:16px; font-size:12px; margin:3px 2px;">Physics-AI Hybrid Frameworks</span>
    <span style="display:inline-block; border:1px solid #ffb74d; color:#ffb74d; background:rgba(255,183,77,0.12); padding:4px 12px; border-radius:16px; font-size:12px; margin:3px 2px;">Multiphase &amp; Cavitation Flows</span>
    <span style="display:inline-block; border:1px solid #ffb74d; color:#ffb74d; background:rgba(255,183,77,0.12); padding:4px 12px; border-radius:16px; font-size:12px; margin:3px 2px;">Turbulence Modeling</span>
    <span style="display:inline-block; border:1px solid #ce93d8; color:#ce93d8; background:rgba(206,147,216,0.12); padding:4px 12px; border-radius:16px; font-size:12px; margin:3px 2px;">MDO &amp; Solver Coupling</span>
