      - layout: top-middle
        title: Finite Element Analysis of Zirconia Dental Prosthesis
        quote: >
          Technologies: FEA, Biomedical Analysis, ANSYS
        description: |
          <div style="display:flex; flex-direction:column; gap:20px;">

