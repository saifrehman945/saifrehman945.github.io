      - layout: top-middle
        title: "KAN-Enhanced CFD Modeling of Drag Reduction in Ventilated Super-Cavities Around Underwater Projectiles"
        additional_links:
          - title: Abstract — Applied Energy
            icon: fas fa-external-link-alt
            url: https://drive.google.com/file/d/1kZEkLTSeFsc2uFp_tjWxbnCTLbBgscmk/view?usp=drive_link
        quote: >
          Under Review — Engineering Applications of Artificial Intelligence (2025) | 2nd Author
        description: |
          <div style="display:flex; gap:24px; align-items:flex-start; flex-wrap:wrap;">

            <!-- LEFT: TEXT -->
            <div style="flex:3; min-width:260px;">

              <p>
              Investigated unsteady ventilated super-cavitation around underwater projectiles using high-fidelity CFD combined with data-driven modeling. The study employs unsteady <strong>RANS</strong> with <strong>VOF</strong> multiphase formulation to resolve cavity dynamics, pressure evolution, and drag characteristics for disk- and cone-based cavitators, with validation against experimental and numerical benchmarks. Building on the CFD dataset, a <strong>Kolmogorov-Arnold Network (KAN)</strong> surrogate model was developed for time-series prediction of drag, demonstrating how physics-based simulation can be coupled with fast, accurate reduced-order models for real-time evaluation of cavitating flows.
              </p>

              <ul>
                <li>Ventilated cavitation achieved up to <strong>57% drag reduction</strong>, corresponding to ~<strong>27% lower propulsion power</strong></li>
                <li>Unsteady CFD framework captured <strong>cavity evolution, wake dynamics, and pressure fluctuations</strong> across operating conditions</li>
                <li><strong>KAN surrogate model</strong> achieved <strong>R² ≈ 0.99</strong> with millisecond-level inference time</li>
                <li>Validated against published experimental and numerical results for reliability</li>
              </ul>

            </div>

            <!-- RIGHT: IMAGES -->
            <div style="flex:2; min-width:240px; display:flex; flex-direction:column; gap:12px;">

              <img src="/images/projects/cavity_details.png"
                  alt="Super-Cavity Flow Structure and Geometry"
                  style="width:100%; border-radius:10px; box-shadow:0 4px 20px rgba(0,0,0,0.6);" />

              <img src="/images/projects/cavitation_comparison_exp.png"
                  alt="Comparison with Experimental Cavitation Results"
                  style="width:100%; border-radius:10px; box-shadow:0 3px 12px rgba(0,0,0,0.5);" />

              <img src="/images/projects/kan_drag_prediction.jpg"
                  alt="KAN-Based Drag Prediction Results"
                  style="width:100%; border-radius:10px; box-shadow:0 3px 12px rgba(0,0,0,0.5);" />

            </div>

          </div>
      - layout: top-middle
        title: "Synergistic Effects of Al₂O₃–Ethylene Glycol/Water Nanofluids and Artificial Roughness on Solar Heater Thermal Performance"
        additional_links:
          - title: Springer
            icon: fas fa-external-link-alt
            url: https://doi.org/10.1007/s10973-025-14571-4
          - title: Scholar
            icon: fas fa-book
            url: https://scholar.google.com/citations?view_op=view_citation&hl=en&user=--WM-zoAAAAJ&citation_for_view=--WM-zoAAAAJ:0EnyYjriUFMC
        quote: >
          Published — Journal of Thermal Analysis and Calorimetry, Springer (2025) | 2nd Author
        description: |
          <div style="display:flex; gap:24px; align-items:flex-start; flex-wrap:wrap;">

            <!-- LEFT: TEXT -->
            <div style="flex:3; min-width:260px;">

              <p>
              Developed and validated a <strong>2D CFD model in ANSYS Fluent</strong> to investigate the combined impact of <strong>Al2O3 nanofluids</strong> (with varying ethylene glycol/water ratios) and <strong>artificial roughness</strong> on solar heater performance. The study evaluates how rib geometry, fluid composition, and turbulence interact to influence heat transfer, pressure drop, and overall thermal-hydraulic efficiency across Reynolds numbers from 3800 to 18000, providing a high-fidelity dataset for simulation-driven design and optimization.
              </p>

              <ul>
                <li><strong>Triangular ribs</strong> produced up to <strong>71.6% heat-transfer enhancement</strong>, significantly outperforming square ribs</li>
                <li><strong>40:60 EG/water nanofluid</strong> delivered the best thermal-hydraulic balance with peak <strong>PEC ≈ 1.5</strong></li>
                <li>Increasing EG concentration improved thermal performance while <strong>reducing friction penalties</strong></li>
                <li>Validated against correlations with <strong>&lt;8% error</strong>, ensuring reliability for design exploration</li>
              </ul>

            </div>

            <!-- RIGHT: IMAGES -->
            <div style="flex:2; min-width:240px; display:flex; flex-direction:column; gap:12px;">

              <img src="/images/projects/solar_method_overview.png"
                  alt="Solar Heater CFD Method Overview"
                  style="width:100%; border-radius:10px; box-shadow:0 4px 20px rgba(0,0,0,0.6);" />

