              <p style="font-size:11px; color:#888;">CFD simulation &amp; cavity evolution</p>
            </div>
          </div>

      - layout: top-middle
        title: Nanofluid Heat Transfer Optimization in Solar Air Heaters
        additional_links:
          - title: Published — Springer
            icon: fas fa-external-link-alt
            url: https://doi.org/10.1007/s10973-025-14571-4
        quote: >
          Technologies: ANSYS Fluent, RNG k-ε RANS, Python, CFD Post-Processing
        description: |
          <div style="display:flex; gap:24px; align-items:flex-start; flex-wrap:wrap; margin-top:8px;">
            <div style="flex:3; min-width:260px;">
              <p>Developed and validated a <strong>2D steady-state RANS CFD model</strong> (RNG k–ε, ANSYS Fluent) for turbulent heat transfer in rib-roughened solar air heater ducts with Al₂O₃–EG/Water nanofluids. Published in <em>J. Thermal Analysis and Calorimetry</em>, Springer (2025).</p>
              <ul>
                <li>Systematic parametric study: nanoparticle concentration (1% vol.), EG/Water composition (20:80 / 40:60 / 60:40), and rib geometries (triangular vs square)</li>
                <li>Optimal: 40/60% EG/Water + inverted triangular ribs → <strong>71.6% heat transfer coefficient increase</strong> over smooth duct baseline</li>
                <li>Near-wall TKE analysis reveals vortex formation and boundary layer reattachment patterns at rib–fluid interfaces</li>
                <li>Peak <strong>PEC = 1.5</strong> confirms thermal gain outweighs pumping cost — validated against Dittus-Boelter and experimental data</li>
              </ul>
            </div>
            <div style="flex:2; min-width:180px; display:flex; flex-direction:column; gap:8px; text-align:center;">
              <img src="/images/projects/solar_domain.png" alt="Solar Heater Computational Domain — Heat Flux and Nanofluid Flow" style="width:100%; border-radius:8px; box-shadow:0 3px 12px rgba(0,0,0,0.5);" />
              <img src="/images/projects/tke_triangular.png" alt="TKE Contour — Triangular Rib Duct" style="width:100%; border-radius:8px; box-shadow:0 3px 12px rgba(0,0,0,0.5);" />
              <p style="font-size:11px; color:#888;">Computational domain &amp; TKE contour (triangular ribs)</p>
            </div>
          </div>

      - layout: top-middle
        title: Adjoint-Based Shape Optimization Framework
        quote: >
          Technologies: C++, Python, Adjoint Solvers, Vertex Morphing, CFD/FEA Coupling | SOCO Engineers (In-House)
        description: |
          <img src="/images/projects/adjoint_workflow.png" alt="Adjoint-Based Shape Optimization Workflow Diagram" style="width:100%; max-width:820px; border-radius:10px; box-shadow:0 4px 20px rgba(0,0,0,0.7); display:block; margin:8px auto 20px;" />
          <div style="display:flex; gap:24px; align-items:flex-start; flex-wrap:wrap;">
            <div style="flex:3; min-width:260px;">
              <p>Designed and implemented a <strong>multi-objective, multi-constraint shape optimization architecture</strong> integrating adjoint sensitivities from external CFD/FEA solvers through a modular solver–optimizer coupling interface — enabling solver-agnostic, scalable design optimization across different physics domains.</p>
              <ul>
                <li><strong>Vertex morphing operator</strong> maps raw node-level shape sensitivities (∂J/∂x) to a control space, producing smooth and mesh-regular filtered sensitivity fields for physically consistent surface updates</li>
                <li><strong>Gradient-based optimizer in control space</strong> drives constrained/unconstrained shape updates using adjoint-derived sensitivity fields — supports large-scale industrial design problems</li>
                <li><strong>Hybrid C++ + Python architecture</strong> — C++ for optimization kernels and parallel execution, Python for workflow orchestration, I/O, and solver interfacing</li>
                <li>Parallel multi-solver execution reduces adjoint computation time by ~50% with modular CI/CD-tested codebase</li>
              </ul>
            </div>
            <div style="flex:2; min-width:180px; display:flex; flex-direction:column; gap:8px; text-align:center;">
              <img src="/images/projects/shape_mirror.png" alt="Car Side Mirror — Shape Optimized Before/After" style="width:100%; border-radius:8px; box-shadow:0 3px 12px rgba(0,0,0,0.5);" />
              <img src="/images/projects/shape_airfoil.png" alt="Airfoil Profile — Initial vs Optimized" style="width:100%; border-radius:8px; box-shadow:0 3px 12px rgba(0,0,0,0.5);" />
              <p style="font-size:11px; color:#888;">Car mirror &amp; airfoil shape optimization results</p>
            </div>
          </div>


      - layout: top-middle
        title: Vortex-Shedding Simulation around Underwater Cylinders
        link: https://github.com/saifrehman945/FluentVortexShedding
        link_text: saifrehman945/FluentVortexShedding
        additional_links:
          - title: GitHub
            icon: fab fa-github
            url: https://github.com/saifrehman945/FluentVortexShedding
        quote: >
          Technologies: ANSYS Fluent, RANS-SST, Python, Flow Animations
        description: |
          Simulated **unsteady vortex shedding** around underwater cylinders at Re = 10,000 using the **RANS-SST** turbulence model. Analyzed unsteady pressure fluctuations, wake dynamics, and vortex-induced vibrations (VIV) — phenomena critical to marine structural stability and fatigue life prediction. Generated flow animations and spectral frequency plots; numerical results validated against experimental benchmarks.

      - layout: top-middle
        title: Hagen-Poiseuille Flow Validation in OpenFOAM v12
        link: https://github.com/saifrehman945/HagenPoiseuilleValidation
        link_text: saifrehman945/HagenPoiseuilleValidation
        additional_links:
          - title: GitHub
            icon: fab fa-github
            url: https://github.com/saifrehman945/HagenPoiseuilleValidation
        quote: >
          Technologies: OpenFOAM v12, Python, Gnuplot, Bash
        description: |
          Modernized the classic Hagen-Poiseuille flow validation from OpenFOAM v6 to v12. Revamped control dictionaries, introduced runtime sampling, and replaced legacy scripts with **Python notebooks** and **Gnuplot** visualizations for reproducible post-processing. A clean, self-contained benchmark for validating laminar pipe flow fundamentals in the modern OpenFOAM ecosystem.

