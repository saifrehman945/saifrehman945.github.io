  - role: Simulation Engineer
    org: SOCO Engineers
    icon: custom/soco
    start: 2023-12-01
    summary: |2-
      * Make core contributions to a node-based, adjoint-driven shape-optimization framework for multi-objective and multi-constraint fluid and structural problems.
      * Investigate sensitivity interpretation, geometry parameterisation, mesh motion, solver coupling, convergence, and numerical verification across simulation formulations.
      * Develop Python orchestration and performance-critical C++ components for reproducible preprocessing, HPC execution, response extraction, and multi-solver studies.
      * Build ANSA/Python geometry and CAE automation for feature recognition, meshing, model preparation, and validation of simulation-ready geometry.
  - role: Research Assistant
    org: NUST (SMME)
    icon: custom/nust
    start: 2022-11-01
    end: 2023-12-01
    summary: |2-
      * Modelled ventilated-supercavitation cases using transient RANS-VOF and investigated cavity development, pressure response, and hydrodynamic drag.
      * Integrated a Kolmogorov-Arnold Network surrogate with CFD time-series data for transient drag-coefficient prediction and comparison with ANN and SVM models.
      * Studied unsteady wake development and force response around a circular cylinder at Re ≈ 10,000, including pressure and frequency-domain validation.
      * Co-authored peer-reviewed thermal-fluid research; my documented contribution was manuscript write-up and draft revision.

