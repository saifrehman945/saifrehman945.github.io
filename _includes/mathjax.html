{%- if site.enable_math -%}
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true,
        processEnvironments: true,
        tags: 'ams'
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      }
    };
  </script>
  <script
    id="MathJax-script"
    async
    src="{{ site.mathjax_src | default: 'https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js' }}">
  </script>
{%- endif -%}
